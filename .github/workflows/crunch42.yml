# 42Crunch REST API Static Security Testing
name: "42Crunch REST API Static Security Testing"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '28 17 * * 4'
permissions:
  contents: read
jobs:
  rest-api-static-security-testing:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 42Crunch REST API Static Security Testing
        if: ${{ secrets.API_TOKEN != '' && (hashFiles('**/openapi*.yaml') != '' || hashFiles('**/openapi*.yml') != '' || hashFiles('**/openapi*.json') != '' || hashFiles('**/swagger*.yaml') != '' || hashFiles('**/swagger*.json') != '') }}
        uses: 42Crunch/api-security-audit-action@fc01ea7a89e6268875868f9d89598af7a9899ae0
        with:
          api-token: ${{ secrets.API_TOKEN }}
          min-score: 75
          upload-to-code-scanning: true
          github-token: ${{ github.token }}
