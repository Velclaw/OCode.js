name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run tests
        run: npm test
      - name: Validate npm package contents
        run: npm pack --dry-run
      - name: Smoke-test built entry point
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./dist/index.js');
          for (const name of ['slugify', 'retry', 'fetchJson', 'readStorage', 'createLogger']) {
            if (!(name in m)) throw new Error(`Missing public export: ${name}`);
          }
          console.log('Public entry point exports verified.');
          NODE
