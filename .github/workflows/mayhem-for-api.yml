# Mayhem API fuzzing. Configure MAYHEM_TOKEN and the API startup/spec before use.
name: "Mayhem for API"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  mayhem-for-api:
    name: Mayhem for API
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Mayhem configuration
        id: config
        shell: bash
        env:
          MAYHEM_TOKEN: ${{ secrets.MAYHEM_TOKEN }}
        run: |
          if [[ -n "$MAYHEM_TOKEN" && -f run_your_api.sh ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Mayhem: MAYHEM_TOKEN and run_your_api.sh are required."
          fi
      - name: Start your API
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: ./run_your_api.sh &
      - name: Mayhem for API
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: ForAllSecure/mapi-action@c31b1886401e3db6ec5c7d7d0ffa4dd6716628cf # v1
        continue-on-error: true
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          api-url: http://localhost:8080
          api-spec: http://localhost:8080/openapi.json
          duration: 60
          sarif-report: mapi.sarif
      - name: Upload SARIF file
        if: ${{ hashFiles('mapi.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: mapi.sarif
