name: Multi-language CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm run build --if-present
          npm test --if-present

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install -r requirements.txt || pip install .
          pip install pytest
          pytest || true

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts') != ''
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - if: hashFiles('pom.xml') != ''
        run: mvn -B verify
      - if: hashFiles('build.gradle', 'build.gradle.kts') != ''
        run: ./gradlew build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('go.mod') != ''
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - if: hashFiles('go.mod') != ''
        run: |
          go build ./...
          go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      - if: hashFiles('Cargo.toml') != ''
        run: |
          cargo build --verbose
          cargo test --verbose

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('**/*.csproj', '**/*.sln') != ''
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - if: hashFiles('**/*.csproj', '**/*.sln') != ''
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
      - if: hashFiles('composer.json') != ''
        run: composer install --no-interaction

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('Gemfile') != ''
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - if: hashFiles('Gemfile') != ''
        run: bundle exec rake || true

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: hashFiles('CMakeLists.txt') != ''
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build || true
