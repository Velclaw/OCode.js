name: "StackHawk"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 1 * * 0'

permissions:
  contents: read

jobs:
  stackhawk:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # DAST is skipped until a real service start script, config, and API key are supplied.
      - name: Start your service
        if: ${{ hashFiles('your-service.sh') != '' }}
        run: ./your-service.sh &

      - name: Run HawkScan
        if: ${{ secrets.HAWK_API_KEY != '' && hashFiles('stackhawk.yml') != '' && hashFiles('your-service.sh') != '' }}
        uses: stackhawk/hawkscan-action@4c3258cd62248dac6d9fe91dd8d45928c697dee0
        continue-on-error: true
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          codeScanningAlerts: true
          githubToken: ${{ github.token }}
