<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCODE.js - Logo</title>
<style>
:root{
  --bg:#ffffff;
  --text-primary:#111111;
  --border:#e5e5e5;
  --border-strong:#c9c9c9;
  --surface:#f5f5f5;
  --accent-bg:#e6f0ff;
  --accent-text:#0b4fb3;
  --accent-border:#8db6f2;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0b0b;
    --text-primary:#f2f2f2;
    --border:#2a2a2a;
    --border-strong:#444444;
    --surface:#1a1a1a;
    --accent-bg:#14264a;
    --accent-text:#9cc3ff;
    --accent-border:#2f5fa8;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.wrap{width:100%;max-width:520px;padding:24px}

/* Logo */
.th{fill:var(--text-primary);font-weight:500}
.l{stroke-dasharray:1;stroke-dashoffset:1}
.go .l{animation:draw .8s cubic-bezier(.65,0,.35,1) both;animation-delay:calc(var(--i)*.13s + .35s)}
.go .sl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease-out both}
.go .js{animation:slide .6s cubic-bezier(.2,.8,.2,1) 1.45s both}
.go .hr{animation:sweep 1.2s cubic-bezier(.65,0,.35,1) .2s both}
.g{transition:transform .25s cubic-bezier(.2,.8,.2,1);transform-box:fill-box}
.g:hover{transform:translateY(-4px)}
.hr{transform-origin:0 50%;transform-box:fill-box}
#logo{display:block;transition:opacity .5s ease}
#logo.out{opacity:0}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  .go *{animation:none!important}
  .l,.sl{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="wrap">

<svg id="logo" class="go" width="100%" viewBox="0 0 380 140" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo OCODE.js</title>
  <desc>Logo chữ OCODE kèm hậu tố .JS, có hiệu ứng vẽ nét và vòng lặp</desc>
  <line class="sl" pathLength="1" x1="12" y1="100" x2="24" y2="44" stroke="var(--border-strong)" stroke-width="1"/>
  <g fill="none" stroke="var(--text-primary)" stroke-width="9" stroke-linejoin="miter" stroke-linecap="butt">
    <g class="g"><rect class="l" pathLength="1" style="--i:0" x="32.5" y="48.5" width="33" height="47" rx="16.5"/></g>
    <g class="g"><path class="l" pathLength="1" style="--i:1" d="M117.5 48.5H101A16.5 16.5 0 0 0 84.5 65V79A16.5 16.5 0 0 0 101 95.5H117.5"/></g>
    <g class="g"><rect class="l" pathLength="1" style="--i:2" x="136.5" y="48.5" width="33" height="47" rx="16.5"/></g>
    <g class="g"><path class="l" pathLength="1" style="--i:3" d="M188.5 48.5H205A16.5 16.5 0 0 1 221.5 65V79A16.5 16.5 0 0 1 205 95.5H188.5Z"/></g>
    <g class="g"><path class="l" pathLength="1" style="--i:4" d="M273.5 48.5H240.5V95.5H273.5M240.5 72H268"/></g>
  </g>
  <text class="th js" x="282" y="96" style="font-size:18px">.JS</text>
  <line class="hr" x1="0" y1="124" x2="380" y2="124" stroke="var(--border)" stroke-width="1"/>
</svg>


</div>

<script>
var s = document.getElementById('logo'), t1, t2;

function play(){
  clearTimeout(t1); clearTimeout(t2);
  s.classList.remove('go','out');
  void s.getBoundingClientRect();
  s.classList.add('go');
  t1 = setTimeout(function(){
    s.classList.add('out');
    t2 = setTimeout(play, 550);
  }, 4200);
}

play();
</script>
</body>
</html>
