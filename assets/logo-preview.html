<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OCode.js — Logo Preview</title>
<style>
:root{color-scheme:light dark;--bg:#f7f9fc;--fg:#101828;--muted:#667085;--panel:#fff;--line:#e5eaf2;--blue:#3478f6}
@media(prefers-color-scheme:dark){:root{--bg:#090d16;--fg:#f4f7ff;--muted:#a2adc2;--panel:#111827;--line:#263246;--blue:#72b7ff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--blue) 12%,transparent),transparent 60%),var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,980px);text-align:center}.card{padding:clamp(22px,5vw,64px);border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 24px 80px #12264b12}
svg{width:100%;height:auto;overflow:visible}.draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.8s cubic-bezier(.65,0,.25,1) forwards}.inner{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.1s .35s ease forwards}.word{opacity:0;transform:translateX(-14px);animation:arrive .65s 1.05s ease forwards}.js{opacity:0;transform:translateX(20px);animation:arrive .6s 1.4s ease forwards}.baseline{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1s 1.8s ease forwards}.loop{transform-origin:126px 127px;animation:glow 3s 2.8s ease-in-out infinite}
p{color:var(--muted);margin:24px 0 0;font-size:14px;letter-spacing:.04em}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes arrive{to{opacity:1;transform:translateX(0)}}@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 9px #3478f655)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw,.inner,.baseline{stroke-dashoffset:0}.word,.js{opacity:1;transform:none}}
</style>
</head>
<body>
<main><section class="card" aria-label="OCode.js animated logo">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">OCode.js</title><desc id="desc">Animated OCode.js wordmark with a geometric blue icon.</desc>
<defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72b7ff"/><stop offset="1" stop-color="#3478f6"/></linearGradient></defs>
<g class="loop" fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M126 47 196 87 196 167 126 207 56 167 56 87Z" stroke="url(#blue)" stroke-width="15"/><path class="inner" d="M126 78 169 103 169 151 126 176 83 151 83 103Z" stroke="currentColor" stroke-width="10"/><path class="inner" d="M112 125h28m-14-14v28" stroke="url(#blue)" stroke-width="9"/></g>
<g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-weight="760" letter-spacing="-3"><text class="word" x="235" y="151" font-size="102" fill="currentColor">OCODE</text><text class="js" x="601" y="151" font-size="102" fill="url(#blue)">.JS</text></g>
<path class="baseline" d="M239 183H720" stroke="url(#blue)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
<text x="240" y="220" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="550" letter-spacing="5" fill="currentColor" opacity=".65">BUILD CLEAR. SHIP CONFIDENTLY.</text>
</svg></section><p>OCode.js · Brand preview · Light/dark mode follows your system preference</p></main>
</body></html>
