name: Framework tests
on:
  push:
    paths: ['framework/**']
  pull_request:
    paths: ['framework/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
